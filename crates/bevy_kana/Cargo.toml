[package]
authors.workspace    = true
categories           = ["game-development", "game-engines"]
description          = "Ergonomic, opinionated utilities for Bevy — type-safe math and cascade values"
edition.workspace    = true
homepage             = "https://github.com/natepiano/hana/tree/main/crates/bevy_kana"
keywords             = ["bevy", "ecs", "gamedev", "math"]
license.workspace    = true
name                 = "bevy_kana"
readme               = "README.md"
repository.workspace = true
version              = "0.4.0-dev"

[lints]
workspace = true

[features]
default = ["math"]
math    = []

[dependencies]
bevy = { workspace = true, features = ["bevy_log"] }

[dev-dependencies]
bevy          = { workspace = true, features = ["3d"] }
bevy_lagrange = { workspace = true }
fairy_dust    = { workspace = true }
hana_diegetic = { workspace = true }
