name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: always
  CARGO_TERM_PROGRESS_WIDTH: 80
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TAPLO_VERSION: 0.10.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
      trybuild: ${{ steps.filter.outputs.trybuild }}
    steps:
      - uses: actions/checkout@v6

      # Gates the `bench` job. Keep automatic triggers focused on benchmark
      # files and performance-sensitive hana_diegetic subsystems. Broader
      # changes, including CI-only edits, can opt in with `[bench]` in the
      # push commit message or by manually dispatching the workflow.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bench:
              - 'crates/hana_diegetic/benches/**'
              - 'crates/hana_diegetic/assets/fonts/**'
              - 'crates/hana_diegetic/src/cascade/**'
              - 'crates/hana_diegetic/src/layout/**'
              - 'crates/hana_diegetic/src/panel/**'
              - 'crates/hana_diegetic/src/render/**'
              - 'crates/hana_diegetic/src/text/**'
              - 'crates/hana_diegetic/src/constants.rs'
              - 'crates/hana_diegetic/src/lib.rs'
              - 'crates/hana_diegetic/Cargo.toml'
            trybuild:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/fairy_dust/Cargo.toml'
              - 'crates/fairy_dust/src/**'
              - 'crates/fairy_dust/tests/trybuild.rs'
              - 'crates/fairy_dust/tests/trybuild/**'
              - 'crates/hana_diegetic/Cargo.toml'
              - 'crates/hana_diegetic/src/ime/**'
              - 'crates/hana_diegetic/src/layout/**'
              - 'crates/hana_diegetic/src/lib.rs'
              - 'crates/hana_diegetic/src/widgets/**'
              - 'crates/hana_diegetic/tests/trybuild.rs'
              - 'crates/hana_diegetic/tests/trybuild/**'

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt -- --check

  taplo:
    name: Taplo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo@${{ env.TAPLO_VERSION }}

      - name: Check TOML formatting
        run: taplo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install and cache Linux dependencies
        uses: natepiano/cache-apt-pkgs-action@1a93bf1cfca3126459c9aea5af90d717f9ea216f
        with:
          packages: libudev-dev libasound2-dev pkg-config clang libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install and cache Linux dependencies
        uses: natepiano/cache-apt-pkgs-action@1a93bf1cfca3126459c9aea5af90d717f9ea216f
        with:
          packages: libudev-dev libasound2-dev pkg-config clang libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace --all-features --examples

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install and cache Linux dependencies
        uses: natepiano/cache-apt-pkgs-action@1a93bf1cfca3126459c9aea5af90d717f9ea216f
        with:
          packages: libudev-dev libasound2-dev pkg-config clang libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Run test targets
        run: cargo nextest run --all-features --workspace --tests
        env:
          WGPU_BACKEND: gl
          WINIT_UNIX_BACKEND: x11
          RUSTFLAGS: -C link-arg=-fuse-ld=mold

  rendering_diagnostic:
    name: Rendering Diagnostic
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: gl
      WINIT_UNIX_BACKEND: x11
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install and cache Linux dependencies
        uses: natepiano/cache-apt-pkgs-action@1a93bf1cfca3126459c9aea5af90d717f9ea216f
        with:
          packages: libudev-dev libasound2-dev pkg-config clang libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Cache rendering diagnostic dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rendering-diagnostic

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Run rendering diagnostic
        run: >-
          cargo nextest run --all-features -p hana_diegetic --lib
          --run-ignored only center_dilation_bounds_corner_wing

  trybuild:
    name: ${{ matrix.name }}
    needs: changes
    if: >-
      needs.changes.outputs.trybuild == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Hana Compile-Time API
            package: hana_diegetic
            cache_key: hana-trybuild
          - name: Fairy Dust Compile-Time API
            package: fairy_dust
            cache_key: fairy-dust-trybuild
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install and cache Linux dependencies
        uses: natepiano/cache-apt-pkgs-action@1a93bf1cfca3126459c9aea5af90d717f9ea216f
        with:
          packages: libudev-dev libasound2-dev pkg-config clang libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Cache compile-time API dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache_key }}

      - name: Run compile-time API tests
        run: >-
          cargo nextest run --all-features -p ${{ matrix.package }} --test trybuild
          --run-ignored only
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold

  bench:
    name: Benchmark
    needs: changes
    if: >-
      needs.changes.outputs.bench == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[bench]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install and cache Linux dependencies
        uses: natepiano/cache-apt-pkgs-action@1a93bf1cfca3126459c9aea5af90d717f9ea216f
        with:
          packages: libudev-dev libasound2-dev pkg-config clang libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion benchmark smoke
        run: cargo bench -p hana_diegetic --benches --features bench_support
        env:
          WGPU_BACKEND: gl
          WINIT_UNIX_BACKEND: x11
          RUSTFLAGS: -C link-arg=-fuse-ld=mold

  mend:
    name: Mend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rust-src, rustc-dev, llvm-tools-preview

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Install and cache Linux dependencies
        uses: natepiano/cache-apt-pkgs-action@1a93bf1cfca3126459c9aea5af90d717f9ea216f
        with:
          packages: libudev-dev libasound2-dev pkg-config clang libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mend
        run: RUSTC_BOOTSTRAP=1 cargo install cargo-mend

      - name: Run cargo mend
        run: cargo mend --fail-on-warn
        env:
          CARGO_TERM_COLOR: never
